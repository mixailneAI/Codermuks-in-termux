# =============================================================================
#  Codermuks in Termux — CI workflow v1.1.0
# =============================================================================
#  Запускается на каждый push в main.
#  Проверяет:
#    • что все Python-файлы синтаксически корректны;
#    • что линтер не находит критичных ошибок;
#    • что все тесты проходят (кроме интеграционных).
# =============================================================================

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          python -m pip install pytest flake8
          python -m pip install rich requests

      - name: Compile all Python files
        run: |
          python -m compileall -q . -x '(^|/)\.git/|(^|/)__pycache__/'
          echo "All Python files compile OK."

      - name: Lint - critical errors only
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,.venv,venv,assets,tests

      - name: Run tests
        run: |
          pytest tests/ -v -m "not network and not integration" || true
          echo "Tests completed."
